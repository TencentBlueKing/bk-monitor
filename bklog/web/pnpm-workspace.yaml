# packages/web-v1 的包名是 @blueking/log-web，与根依赖同名，不能加入 workspace。
# 不要在 bklog/web 执行 pnpm install。Vue 2 的 webpack 仍使用 npm 扁平 node_modules。
# 安装 V3：pnpm --dir packages/web-v3 --ignore-workspace install
packages:
  - 'packages/web-v3'

publicHoistPattern:
  - '!vue'
  - '!vue@*'
  - '!@vue/*'
  - '!vue-router'
  - '!vue-router@*'
  - '!vuex'
  - '!vuex@*'
