  - p50
  - p95
  relative_regression_floor_percent: 1
  threshold: max(baseline_noise_upper_bound, relative_regression_floor_percent)
  exact_gates:
  - normalized_sql
  - accessed_tables
  - remote_actions_and_parameters
  - celery_messages
  - imported_v3_modules
