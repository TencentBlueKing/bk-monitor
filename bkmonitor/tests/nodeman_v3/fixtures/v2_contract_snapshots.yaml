          plugin_step: STOP
          bkmonitorbeat: STOP
    normalized_response:
      task_id: 456
      step_ids:
      - plugin_step
      - bkmonitorbeat
    state:
      operation_result: PREPARING
      last_operation: STOP
      task_ids:
      - 456
