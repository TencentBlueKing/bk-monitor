# 主动授权，网关主动给应用，添加访问网关所有资源或者具体某个资源的权限；
# 用于命令 `grant_apigw_permissions`
grant_permissions:
  - bk_app_code: "{{ settings.APP_CODE }}" ## 环境变量方式："{{ environ.BK_APP_CODE }}"
    # 授权维度，可选值：
    # gateway: 按网关授权，包括网关下所有资源，以及未来新创建的资源
    # resource: 按资源维度授权
    grant_dimension: "gateway"
    # 如果是按照 resource 维度授权,需要提供如下的具体resource_name
    # resource_names:
    #   - resource_name_1
    #   - resource_name_2
  - bk_app_code: bk_log_search
    grant_dimension: "gateway"
  - bk_app_code: bk-incident
    grant_dimension: "gateway"
  - bk_app_code: bkincident
    grant_dimension: "gateway"
  - bk_app_code: bk_sops
    grant_dimension: "resource"
    resource_names:
      - add_shield
      - disable_shield
      - search_alarm_strategy
  - bk_app_code: bk_apigateway
    grant_dimension: "resource"
    resource_names:
      - graph_promql_query
  - bk_app_code: bk_bcs_app
    grant_dimension: "resource"
    resource_names:
      - metadata_create_space
      - metadata_list_spaces
      - graph_promql_query
      - query_bcs_metrics
      - metadata_query_bcs_related_data_link_info
      - metadata_query_data_source
  - bk_app_code: bk_paas3
    grant_dimension: "resource"
    resource_names:
      - create_apm_application
      - apm_create_application
      - metadata_create_space
      - metadata_update_space
      - metadata_get_space_detail
      - search_alert
      - search_alarm_strategy_v3
      - graph_promql_query
      - as_code_import_config
      - quick_import_dashboard
      - delete_alarm_strategy
  - bk_app_code: bk_dbm
    grant_dimension: "resource"
    resource_names:
      - query_custom_event_group
      - custom_time_series
      - get_custom_event_group
      - custom_time_series_detail
      - create_custom_time_series
      - create_custom_event_group
      - save_alarm_strategy_v3
      - switch_alarm_strategy
      - update_partial_strategy_v3
      - delete_alarm_strategy_v3
      - search_alarm_strategy_v3
      - save_collect_config
      - run_collect_config
      - query_collect_config
      - get_collect_config_list
      - query_collect_config_detail
      - search_user_groups
      - search_user_group_detail
      - delete_user_groups
      - save_user_group
      - save_duty_rule
      - search_duty_rules
      - delete_duty_rules
      - save_rule_group
      - search_rule_groups
      - delete_rule_group
      - search_event
      - search_alert
      - time_series_unify_query
      - proxy_host_info
      - search_action_config
      - save_action_config
      - edit_action_config
      - add_shield
      - disable_shield
      - edit_shield
      - list_shield
      - get_shield
      - bulk_save_subscribe
      - bulk_delete_subscribe
      - list_subscribe
      - collector_plugin_list
      - plugin_import_without_frontend
      - save_alarm_strategy
      - start_render_image_task
      - get_render_image_task_result
      - metadata_get_data_id
  - bk_app_code: bk_nodeman
    grant_dimension: "resource"
    resource_names:
      - metadata_get_or_create_agent_event_data_id
  - bk_app_code: bk_nodemgr
    grant_dimension: "resource"
    resource_names:
      - metadata_get_or_create_agent_event_data_id
  - bk_app_code: bk_fara
    grant_dimension: "resource"
    resource_names:
      - list_flatten_spans
      - search_alert
      - list_flatten_traces
      - search_alarm_strategy
      - alert_top_n
      - search_user_groups
      - list_alert_tags
      - metadata_get_space_detail
      - metadata_biz_has_data_id
      - list_trace_view_config
      - query_apm_trace_option_values
      - query_apm_span_option_values
      - promql_to_query_config
      - query_config_to_promql
      - get_variable_value
      - time_series_unify_query
      - time_series_functions
      - query_apm_span_list
      - query_apm_trace_detail
      - detail_apm_application
      - v2_event_logs
  - bk_app_code: bk_hcm
    grant_dimension: "resource"
    resource_names:
