# MCP Server 声明使用 spec_version 2，按 stages 同步。
spec_version: 2

# 定义发布内容，用于命令 `create_version_and_release_apigw`
release:
  # 发布版本号；
  # 资源配置更新，需更新此版本号才会发布资源版本，此版本号和 sdk 版本号一致，错误设置会影响调用方使用
  version: 0.0.8
  # 版本标题
  title: "自动同步监控 MCP Server"
  # 版本描述
  comment: "发布资源后统一同步 bk-monitor 网关的 MCP Server 配置与工具清单"

# 定义网关基本信息，用于命令 `sync_apigw_config`
apigateway:
  description: "蓝鲸监控平台API网关"
  # 网关的英文描述，蓝鲸官方网关需提供英文描述，以支持国际化
  description_en: "Blueking Monitor API Gateway"
  # 是否公开；公开，则用户可查看资源文档、申请资源权限；不公开，则网关对用户隐藏
  is_public: true
  # 标记网关为官方网关，网关名需以 `bk-` 开头，可选；非官方网关，可去除此配置
  api_type: 1
  # 应用请求网关时，是否允许从请求参数 (querystring, body) 中获取蓝鲸认证信息，默认值为 true；
  # 如果为 false，则只能从请求头 X-Bkapi-Authorization 获取蓝鲸认证信息；
  # 新接入的网关，可以设置为 false，已接入的网关，待推动所有调用者将认证信息放到请求头后，可设置为 false
  allow_auth_from_params: false
  # 网关请求后端时，是否删除请求参数 (querystring, body) 中的蓝鲸认证敏感信息，比如 bk_token，为 true 表示允许删除；
  # 待请求网关的所有调用者，将认证参数放到请求头 X-Bkapi-Authorization 时，可将此值设置为 false
  allow_delete_sensitive_params: false
  # 网关维护人员，仅维护人员有管理网关的权限
  maintainers: {{ settings.APIGW_MANAGERS }}

# 定义环境信息，用于命令 `sync_apigw_stage`。
# 每次部署仅声明本次发布的 stage，避免更新其他环境。
stages:
  - {% if settings.APIGW_STAGE == "prod" %}
    name: "prod"
    description: "生产环境"
    description_en: "Production Environment"
    {% else %}
    name: "stage"
    description: "测试环境"
    description_en: "Test Environment"
    {% endif %}
    # 保持现有后端、超时与鉴权来源 Header。
    proxy_http:
      timeout: 60
      upstreams:
        loadbalance: "roundrobin"
        hosts:
          - host: "{{ settings.BK_MONITOR_API_HOST }}"
            weight: 100
      transform_headers:
        set:
          x-bkapi-from: "apigw"
    # name 只填写后缀，网关生成 bk-monitor-{stage}-{name}，接管已有同名 Server。
    # 显式维护工具清单；新增资源须评审后加入对应 Server，不按文件名自动暴露。
    # 不配置 target_app_codes，不为其他业务应用新增主动授权。
    mcp_servers:
      - &public_mcp_server
        name: "metadata-query"
        title: "蓝鲸观测-元数据查询MCP"
        description: "蓝鲸观测MCP（Streamable HTTP）--元数据查询服务"
        labels: ["BKM"]
        is_public: true
        status: 1
        protocol_type: "streamable_http"
        oauth2_public_client_enabled: true
        oauth2_personal_client_enabled: true
        raw_response_enabled: false
        category_names: ["Observability"]
        resource_names:
          - list_bcs_clusters
          - search_spaces
      - <<: *public_mcp_server
        name: "metrics-query"
        title: "蓝鲸观测-指标查询MCP"
        description: "蓝鲸观测MCP（Streamable HTTP）--指标查询服务"
        resource_names:
          - list_time_series_groups
          - list_time_series_metrics
          - execute_range_query
          - execute_sql_query
      - <<: *public_mcp_server
        name: "log-query"
        title: "蓝鲸观测-日志查询MCP"
        description: "蓝鲸观测MCP（Streamable HTTP）--日志查询服务"
        resource_names:
          - list_index_sets
          - get_index_set_fields
          - search_logs
          - search_index_set_context
          - analyze_field
          - search_log_clustering_pattern
      - <<: *public_mcp_server
        name: "log-scene-search"
        title: "蓝鲸观测-日志场景化检索 MCP"
        description: "蓝鲸观测-日志场景化检索 MCP"
        category_names: ["Monitoring"]
        resource_names:
          - list_log_scenes
          - list_scene_dimension_values
          - get_scene_log_fields
          - search_logs
      - <<: *public_mcp_server
        name: "event-query"
        title: "蓝鲸观测-事件查询MCP"
        description: "蓝鲸观测MCP（Streamable HTTP）--事件查询服务"
        resource_names:
          - list_events
          - get_event_view_config
          - search_event_log
      - <<: *public_mcp_server
        name: "alarm"
        title: "蓝鲸观测-告警查询MCP"
        description: "蓝鲸观测MCP（Streamable HTTP）--告警查询服务"
        resource_names:
          - list_alerts
          - get_alert_top_n
          - get_strategy_snapshot
          - get_strategy_detail
          - get_alert_info
          - get_alert_events
          - get_alert_event_ts
          - get_alert_event_tag_detail
          - get_alert_k8s_target
