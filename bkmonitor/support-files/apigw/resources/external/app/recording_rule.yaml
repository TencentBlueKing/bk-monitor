paths:
  /app/recording_rule/preview_config/:
    post:
      operationId: recording_rule_preview_config
      description: 预解析 RecordingRule 配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config
              anyOf:
              - required:
                - bk_biz_id
              - required:
                - space_uid
              properties:
                bk_biz_id:
                  type: integer
                  description: 业务 ID，与 space_uid 至少提供一个
                space_uid:
                  type: string
                  description: 空间 UID，与 bk_biz_id 至少提供一个
                config:
                  oneOf:
                  - type: object
                  - type: string
                  description: AsCode 单 group 对象或 YAML 字符串，不含外层 groups
                id:
                  type: integer
                  minimum: 1
                  description: 规则组 ID，必须属于当前租户及指定空间且未软删除
      responses:
        '200':
          description: 标准响应信封；保存与下发结果分别见 data.saved 和 data.execution
      x-bk-apigateway-resource:
        isPublic: true
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v4/recording_rule/preview_config/
          matchSubpath: false
          timeout: 0
        authConfig:
          appVerifiedRequired: true
          userVerifiedRequired: false
          resourcePermissionRequired: true
