        backend:
          name: default
          method: post
          path: /api/v4/recording_rule_mcp/update_config/
          matchSubpath: false
          timeout: 0
        authConfig:
          appVerifiedRequired: false
          userVerifiedRequired: true
          resourcePermissionRequired: true
