paths:
  /mcp/preview_recording_rule/:
    post:
      operationId: preview_recording_rule
      description: 'Preview a RecordingRule without saving or applying it. Returns deployment_check with counts, limits and can_apply; over-limit configurations remain parseable. Business errors use HTTP 200 with result=false, code=3300004 and data.errors entries with code/message/path. Deployment errors are SOURCE_LIMIT_EXCEEDED or RULE_LIMIT_EXCEEDED with actual/limit; inspect can_apply before applying. 预解析预计算规则，deployment_check 返回数量、上限和是否可下发，超限仍返回解析结果。解析业务错误使用 HTTP 200、result=false、code=3300004 和 data.errors（code/message/path），部署超限返回 SOURCE_LIMIT_EXCEEDED 或 RULE_LIMIT_EXCEEDED（含 actual/limit），调用方需检查 can_apply。 Requires a verified gateway
        user and business-scoped RecordingRule permission. 必须通过网关用户鉴权并拥有当前业务的预计算规则权限。 Required IAM action: view_recording_rule_v2.
        所需业务权限：view_recording_rule_v2。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bk_biz_id
              - config
              properties:
                bk_biz_id:
                  type: string
                  description: Business ID used for user authorization. 业务 ID，用于用户权限校验。
                space_uid:
                  type: string
                  description: Optional space UID; must match the business. 可选空间 UID，必须与业务一致。
                config:
                  oneOf:
                  - type: object
                    additionalProperties: true
                  - type: string
                  description: One AsCode group object or YAML string, without the outer groups field. 单个 AsCode
                    group 对象或 YAML 字符串，不含外层 groups。
                id:
                  type: integer
                  minimum: 1
                  description: Active rule ID from list_recording_rules in this business. 当前业务内未软删除的规则 ID，通过 list_recording_rules
                    获取。
      responses:
        '200':
          description: 标准响应信封；保存与下发结果分别见 data.saved 和 data.execution
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v4/recording_rule_mcp/preview_config/
          matchSubpath: false
          timeout: 0
        authConfig:
          appVerifiedRequired: false
          userVerifiedRequired: true
          resourcePermissionRequired: true
      tags:
      - recording_rule_mcp
  /mcp/create_recording_rule/:
    post:
      operationId: create_recording_rule
      description: 'Create a RecordingRule; apply defaults to false. 新建预计算规则。 Requires a verified gateway user and
        business-scoped RecordingRule permission. 必须通过网关用户鉴权并拥有当前业务的预计算规则权限。 Required IAM action: manage_recording_rule_v2.
        所需业务权限：manage_recording_rule_v2。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bk_biz_id
              - config
              - confirm
              properties:
                bk_biz_id:
                  type: string
                  description: Business ID used for user authorization. 业务 ID，用于用户权限校验。
                space_uid:
                  type: string
                  description: Optional space UID; must match the business. 可选空间 UID，必须与业务一致。
                config:
                  oneOf:
                  - type: object
                    additionalProperties: true
                  - type: string
                  description: One AsCode group object or YAML string, without the outer groups field. 单个 AsCode
                    group 对象或 YAML 字符串，不含外层 groups。
                apply:
                  type: boolean
                  default: false
                  description: Resolve and apply immediately; defaults to false and does not change auto_refresh.
                    是否立即解析下发，默认 false，不改变 auto_refresh。
                confirm:
                  type: boolean
                  enum:
                  - true
                  description: Must be true after explicit user confirmation. 用户明确确认后必须传 true。
      responses:
        '200':
          description: 标准响应信封；保存与下发结果分别见 data.saved 和 data.execution
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: true
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v4/recording_rule_mcp/create_config/
          matchSubpath: false
          timeout: 0
        authConfig:
          appVerifiedRequired: false
          userVerifiedRequired: true
          resourcePermissionRequired: true
      tags:
      - recording_rule_mcp
