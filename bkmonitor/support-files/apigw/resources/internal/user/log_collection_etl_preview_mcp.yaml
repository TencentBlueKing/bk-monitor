paths:
  /mcp/preview_log_etl/:
    post:
      operationId: preview_log_etl
      description: >-
        Preview field extraction from one sample log. Read-only; never writes collectors or clean configs.
        etl_params only accept extraction keys: delimiter needs separator; regexp needs separator_regexp
        and optional is_grok; text/json accept no etl_params. retain_original_text, metadata_fields and
        ext_json_config cannot be previewed. 预览一条样例的字段提取结果。只读。预览只接受影响提取的参数，试不出入库形态。
      tags:
      - log_collection_mcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - bk_biz_id
              - etl_config
              - data
              properties:
                bk_biz_id:
                  type: integer
                  description: Business ID in BlueKing Monitor. Identifies the business space. 业务ID，用于标识业务空间。
                etl_config:
                  type: string
                  enum:
                  - bk_log_text
                  - bk_log_json
                  - bk_log_regexp
                  - bk_log_delimiter
                  description: >-
                    Cleaning type. bk_log_text = ingest as-is / 直接入库 (default on Fast Create); bk_log_json
                    = JSON; bk_log_delimiter = delimiter; bk_log_regexp = regular expression. custom is
                    not supported. 清洗类型。直接入库 / JSON / 分隔符 / 正则。不支持 custom。
                etl_params:
                  type: object
                  additionalProperties: false
                  default: {}
                  properties:
                    separator:
                      type: string
                      minLength: 1
                      maxLength: 128
                      description: >-
                        Delimiter for bk_log_delimiter. Preset IDs: | , ` space ; \t. Required for delimiter
                        cleaning. 分隔符，分隔符清洗必填。预置 | , ` 空格 ; 制表符。
                    separator_regexp:
                      type: string
                      minLength: 1
                      maxLength: 4096
                      description: >-
                        Golang regular expression that must match the whole log line. Named groups become
                        fields. Required for bk_log_regexp. Max 4096 chars on preview. 正则表达式（golang 语法），需匹配日志全文，命名捕获组会成为字段。正则清洗必填。
                    is_grok:
                      type: boolean
                      description: >-
                        Whether separator_regexp is a Grok expression (%{PATTERN}). Only valid for bk_log_regexp.
                        UI default true on the new clean page. 是否按 Grok 处理 separator_regexp，仅正则清洗可用。
                  description: >-
                    Complete cleaning parameters (full replacement). Preview only accepts the extraction-related
                    keys of the chosen etl_config; retain_original_text and similar persist-only keys
                    cannot be previewed. 清洗参数，写入时整体替换。预览只接受影响字段提取的键。
                data:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: >-
                    One sample log line for preview. 1-10000 characters. At most 100 extracted fields
                    are returned. 单条样例日志，1-10000 字符，最多返回 100 个提取字段。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend:
          name: default
          method: post
          path: /api/v4/log_collection_etl_preview/preview/
          matchSubpath: false
          timeout: 30
        pluginConfigs: []
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: false
          resourcePermissionRequired: true
