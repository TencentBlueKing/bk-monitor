paths:
  /mcp/lookup_tool/:
    post:
      operationId: lookup_tool
      description: >-
        Query the deterministic tool catalog exposed by the unified observability MCP Server.
        Supports exact tool_name and enum-based category/capability filters. Private or specialized
        MCP Servers are excluded from this public catalog. This tool does not perform semantic search
        or call a model. Agent 根据用户意图选择过滤条件和最终工具；私有或专用 MCP Server 不进入本目录。
        服务端不做自然语言理解、模糊搜索或相关性排序。
      tags: [unified_mcp]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tool_name:
                  type: string
                  description: Exact tool name. 精确工具名，不支持模糊匹配。
                category:
                  type: string
                  enum: [metrics, log, alert, event, apm, dashboard, relation, alert_handling, log_collection, log_extract, metadata]
                  description: Public tool domain, including query, management, extraction and metadata MCP families. 公开工具领域，覆盖查询、配置管理、日志提取与元数据 MCP 类别；内部 operation MCP 不进入目录。
                capability:
                  type: string
                  enum: [discovery, query, analysis, detail, relation, mutation, export]
                  description: Capability filter, including production mutations and data export. 能力类型过滤，包含生产写操作与数据导出。
                bk_biz_id:
                  type: string
                  description: Optional target space for permission-state filtering. 可选，按目标空间过滤权限状态。
                available_only:
                  type: boolean
                  default: true
                  description: Hide tools with known missing permission; native instance tools remain discoverable as requires_resource until a target is supplied. 隐藏已知缺权工具；尚未指定实例的原生工具以 requires_resource 状态保留，不代表已获权。
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Page number, starting from 1. 页码，从 1 开始。
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: Number of tools per page, from 1 to 100. 每页工具数，范围为 1 到 100。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_tool/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_tool_schema/:
    post:
      operationId: lookup_tool_schema
      description: >-
        Return one registered tool's exact input schema, prerequisites, permission requirement,
        execution status, limits and return description. tool_name must match exactly.
        按精确工具名查询底层工具完整调用契约及执行状态。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool_name]
              properties:
                tool_name: {type: string, description: Exact registered tool name. 底层工具精确名称。}
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_tool_schema/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/execute_tool/:
    post:
      operationId: execute_tool
      description: >-
        Execute one registered underlying tool after validating arguments and resource scope. Enabled tools
        check native permissions first and the original MCP action only after explicit denial; errors never
        trigger fallback. Other tools retain legacy permissions. Mutation and data-export tools require confirm=true
        after explicit user confirmation; the field is removed before calling backends that do not define it.
        Agent supplies tool_name and business tool_args; permission and backend routing come from the registry.
        执行一个已登记的底层工具，服务端先校验参数与资源范围。启用工具先查原生权限，明确无权才检查原 MCP 权限，
        异常不回退；其他工具保留旧权限模式。
        写操作、任务和数据导出必须在用户明确确认后传 confirm=true；原接口没有该字段时，分发前会移除。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool_name, tool_args]
              properties:
                tool_name: {type: string, description: Exact underlying tool name. 底层工具精确名称。}
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching lookup_tool_schema.input_schema. 必须符合 lookup_tool_schema.input_schema 的业务参数。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/execute_tool/, matchSubpath: false, timeout: 63}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_metadata/:
    post:
      operationId: lookup_metadata
      description: >-
        Query observability spaces or BCS clusters through existing metadata APIs. metadata_type=spaces
        requires space_name; metadata_type=bcs_clusters requires bk_biz_id. 通过现有元数据 API
        查询观测空间或 BCS 集群；metadata_type=spaces 时需要 space_name，
        metadata_type=bcs_clusters 时需要 bk_biz_id。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata_type]
              properties:
                metadata_type:
                  type: string
                  enum: [spaces, bcs_clusters]
                  description: Metadata resource type, either spaces or bcs_clusters. 元数据资源类型，可选空间或 BCS 集群。
                space_name:
                  type: string
                  description: Space name keyword; required when metadata_type=spaces. 空间名称关键字，metadata_type=spaces 时必填。
                bk_biz_id:
                  type: string
                  description: Target business/space ID; required when metadata_type=bcs_clusters. 目标业务或空间 ID，metadata_type=bcs_clusters 时必填。
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Page number, starting from 1; used for spaces lookup. 页码，从 1 开始，仅用于空间查询。
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Number of spaces per page, from 1 to 100. 每页空间数，范围为 1 到 100。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_metadata/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_permissions/:
    post:
      operationId: lookup_permissions
      description: >-
        Query the current user's observability permission scopes. Can check by space, category or exact
        tool name and return missing IAM actions plus an application URL. Read-only: it never grants
        permission and never replaces execute_tool's final authorization check. Enabled tools check native
        permissions first and the legacy MCP action only after explicit denial, reporting authorization_source.
        Tools that retain additional permissions from their original route report every required action.
        resource_context can identify a log index set or scene, time-series table, APM application,
        dashboard, alert, or strategy; unresolved resources are not grants.
        查询当前用户的可观测权限范围。可按空间、领域或精确工具名检查，并返回缺失的 IAM 权限点及申请入口；
        启用工具先查原生权限，明确无权才检查旧 MCP 权限，并返回 authorization_source；原路由还有附加权限的工具会返回全部必需权限。
        resource_context 支持日志索引集／场景、时序表、APM 应用、仪表盘、告警或策略。
        缺少必要资源不代表授权通过。本工具只读，不授予权限，也不替代 execute_tool 的最终鉴权。
      tags: [unified_mcp]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bk_biz_id: {type: string, description: Target business/space ID. 目标业务 ID。}
                category:
                  type: string
                  enum: [metrics, log, alert, event, apm, dashboard, relation, alert_handling, log_collection, log_extract, metadata]
                  description: Public tool domain used to select the corresponding IAM action. 公开工具领域，用于选择对应的 IAM 权限点；内部 operation MCP 不进入 Unified 权限查询。
                tool_name: {type: string, description: Exact underlying tool name. 底层工具精确名称。}
                resource_context:
                  type: object
                  additionalProperties: false
                  description: Optional target context for an exact native-first tool. 原生优先工具的目标资源上下文，提供时必须指定 tool_name。
                  properties:
                    index_set_id:
                      type: integer
                      minimum: 1
                      description: Index set ID discovered from the log catalog. 从日志目录取得的索引集 ID。
                    target_type:
                      type: string
                      enum: [index_set, scene]
                      description: Log target mode. Scene routes are authorized again by BK Log after resolving actual index sets. 日志目标模式；场景路由解析出实际索引集后由日志平台继续鉴权。
                    table_id:
                      type: string
                      description: Time-series result table ID discovered from the metric catalog. 从指标目录取得的时序结果表 ID。
                    table:
                      type: string
                      description: Event table ID discovered from the event catalog. 从事件目录取得的事件结果表 ID。
                    app_name:
                      type: string
                      description: APM application name discovered from the application catalog. 从 APM 应用目录取得的应用名称。
                    service_name:
                      type: string
                      description: APM service name required to select an APM-backed event branch. 用于选择 APM 事件分支的服务名称。
                    dashboard_uid:
                      type: string
                      description: Dashboard UID discovered from the dashboard tree. 从仪表盘目录取得的仪表盘 UID。
                    id:
                      type: string
                      description: Alert ID for detail or snapshot, strategy ID for current configuration. 详情或快照工具的告警 ID，或当前策略配置工具的策略 ID。
                    alert_id:
                      type: string
                      description: Alert ID for alert-related queries. 告警关联查询的告警 ID。
                include_apply_guide:
                  type: boolean
                  default: true
                  description: Return an IAM application URL when permission is missing. 缺少权限时是否返回 IAM 权限申请入口。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_permissions/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}
