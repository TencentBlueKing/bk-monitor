paths:
  /mcp/lookup_tool/:
    post:
      operationId: lookup_tool
      description: >-
        Use this first when the exact underlying tool is unknown. Translate the user's intent into a
        category and/or capability filter; tool_name only accepts an exact registered ID and must not
        contain a natural-language request. This deterministic catalog does not perform semantic search
        or call a model. Inspect each candidate's required_context and prerequisites, select one exact
        tool, then call lookup_tool_schema before execute_tool. Skip discovery only when the exact tool
        and its contract for the current catalog_version are already known. Private or specialized MCP
        Servers are excluded. 当尚不确定底层工具时先调用本工具：由 Agent 将用户意图转换为 category／capability，
        tool_name 只接受精确工具 ID，不能传自然语言问题。服务端不做语义搜索、模糊搜索或模型排序。
        读取候选工具的 required_context 与 prerequisites，选定一个精确工具后调用 lookup_tool_schema，
        再进入 execute_tool；只有已知精确工具且已持有当前 catalog_version 对应契约时才可跳过发现。
      tags: [unified_mcp]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tool_name:
                  type: string
                  description: Exact tool name. 精确工具名，不支持模糊匹配。
                category:
                  type: string
                  enum: [metrics, log, alert, event, apm, dashboard, relation, alert_handling, log_collection, log_extract, metadata]
                  description: Public tool domain, including query, management, extraction and metadata MCP families. 公开工具领域，覆盖查询、配置管理、日志提取与元数据 MCP 类别；内部 operation MCP 不进入目录。
                capability:
                  type: string
                  enum: [discovery, query, analysis, detail, relation, mutation, export]
                  description: Capability filter, including production mutations and data export. 能力类型过滤，包含生产写操作与数据导出。
                bk_biz_id:
                  type: string
                  description: Optional target space for permission-state filtering. 可选，按目标空间过滤权限状态。
                available_only:
                  type: boolean
                  default: true
                  description: Hide tools with known missing permission; native instance tools remain discoverable as requires_resource until a target is supplied. 隐藏已知缺权工具；尚未指定实例的原生工具以 requires_resource 状态保留，不代表已获权。
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Page number, starting from 1. 页码，从 1 开始。
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
                  description: Number of tools per page, from 1 to 100. 每页工具数，范围为 1 到 100。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_tool/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_tool_schema/:
    post:
      operationId: lookup_tool_schema
      description: >-
        Call this after selecting one exact tool and before execute_tool, unless the same tool contract
        for the current catalog_version is already available. Read input_schema, guidelines, prerequisites,
        permission, execution and limits; do not infer arguments from the tool name or examples. If required
        business or resource identifiers are missing, use lookup_metadata for spaces/BCS clusters or call
        the prerequisite tools named in this response. For mutation or data-export tools, review the target
        and effect and obtain explicit user confirmation before execution. 选定精确工具后、执行前调用本工具；
        仅在已持有当前 catalog_version 对应契约时可复用缓存。必须读取 input_schema、guidelines、
        prerequisites、permission、execution 和 limits，不能根据工具名或示例猜参数。缺少业务／资源标识时，
        空间或 BCS 集群使用 lookup_metadata，其余标识调用本响应列出的前置工具；写入、任务和导出还须先确认影响并获得用户明确同意。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool_name]
              properties:
                tool_name: {type: string, description: Exact registered tool name. 底层工具精确名称。}
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_tool_schema/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/execute_tool/:
    post:
      operationId: execute_tool
      description: >-
        Final execution step for one exact registered tool. Before calling, read lookup_tool_schema for the
        current catalog_version, satisfy its prerequisites, and obtain every business/resource ID from
        lookup_metadata or prerequisite tool results; never guess IDs or permission actions. Ordinary read-only
        queries may execute directly after the contract is complete; use lookup_permissions when the user asks
        about access or after a permission denial. Mutation, task and data-export tools require a target/effect
        preview, explicit user confirmation and confirm=true; permission preflight is recommended after resolving
        the target. The Server always revalidates JSON Schema, tenant/resource ownership and authorization.
        Native denial alone may fall back to the original MCP action; errors never fall back. After execution,
        verify both the transport envelope and the business result instead of treating HTTP 200 as success.
        本工具是精确底层工具的最终执行步骤。执行前读取当前 catalog_version 对应的 lookup_tool_schema，
        完成 prerequisites，并从 lookup_metadata 或前置工具结果取得真实业务／资源 ID；禁止猜测 ID 或权限点。
        普通只读查询在契约完整后可直接执行，用户询问权限或执行被拒时再调用 lookup_permissions。
        写入、任务和导出必须先展示目标与影响、获得明确确认并传 confirm=true，解析目标后建议先做权限预检。
        服务端始终重验 Schema、租户／资源归属和权限；只有原生明确无权才回退旧 MCP 权限，异常不回退。
        执行后同时检查传输层结果和业务结果，不能把 HTTP 200 直接当作业务成功。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tool_name, tool_args]
              properties:
                tool_name: {type: string, description: Exact underlying tool name. 底层工具精确名称。}
                tool_args:
                  type: object
                  additionalProperties: true
                  description: Arguments matching lookup_tool_schema.input_schema. 必须符合 lookup_tool_schema.input_schema 的业务参数。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/execute_tool/, matchSubpath: false, timeout: 63}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_metadata/:
    post:
      operationId: lookup_metadata
      description: >-
        Use this when the target observability space/business ID is unknown, or when a BCS cluster list is
        required by the selected tool. Search spaces with a real, user-provided space-name keyword and reuse
        the returned bk_biz_id; never invent or infer a business ID. metadata_type=spaces requires space_name, while
        metadata_type=bcs_clusters requires a resolved bk_biz_id. This facade only resolves spaces and BCS
        clusters; obtain index sets, tables, applications, dashboards, alerts and other identifiers from the
        prerequisite tools returned by lookup_tool_schema. 当目标观测空间／业务 ID 未知，或所选工具需要 BCS
        集群列表时调用。使用用户提供的真实空间名称检索并复用返回的 bk_biz_id，禁止猜测业务 ID。
        metadata_type=spaces 需要 space_name，metadata_type=bcs_clusters 需要已解析的 bk_biz_id。
        本门面只解析空间与 BCS 集群；索引集、结果表、应用、仪表盘、告警等标识应从 lookup_tool_schema
        返回的前置工具中获取。
      tags: [unified_mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metadata_type]
              properties:
                metadata_type:
                  type: string
                  enum: [spaces, bcs_clusters]
                  description: Metadata resource type, either spaces or bcs_clusters. 元数据资源类型，可选空间或 BCS 集群。
                space_name:
                  type: string
                  description: Space name keyword; required when metadata_type=spaces. 空间名称关键字，metadata_type=spaces 时必填。
                bk_biz_id:
                  type: string
                  description: Target business/space ID; required when metadata_type=bcs_clusters. 目标业务或空间 ID，metadata_type=bcs_clusters 时必填。
                page:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Page number, starting from 1; used for spaces lookup. 页码，从 1 开始，仅用于空间查询。
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                  description: Number of spaces per page, from 1 to 100. 每页空间数，范围为 1 到 100。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_metadata/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}

  /mcp/lookup_permissions/:
    post:
      operationId: lookup_permissions
      description: >-
        Use this only when the user asks what they can access, before a mutation/task/data export after the
        target is resolved, or after a permission denial. Do not call it before every ordinary read-only query.
        Query the current user's scope by space, category or exact tool. For instance-scoped tools, first obtain
        the real resource from lookup_metadata or the prerequisite tools and pass matching resource_context;
        requires_resource means unresolved, not granted. The response reports native/legacy checks,
        authorization_source, missing IAM actions and optional application URLs. Never open or submit an
        application automatically. This read-only tool does not grant permission and never replaces execute_tool's
        final authorization check. 仅在用户主动询问可访问范围、目标已解析后的写入／任务／导出预检，或权限拒绝后调用；
        普通只读查询不必每次预查权限。可按空间、领域或精确工具查询当前用户权限。实例级工具必须先通过
        lookup_metadata 或前置工具取得真实资源，再传匹配的 resource_context；requires_resource 表示资源未解析，
        不代表已授权。返回值区分 native／legacy、authorization_source、缺失权限与可选申请入口；不得自动打开或提交申请。
        本工具只读，不授予权限，也不替代 execute_tool 的最终鉴权。
      tags: [unified_mcp]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bk_biz_id: {type: string, description: Target business/space ID. 目标业务 ID。}
                category:
                  type: string
                  enum: [metrics, log, alert, event, apm, dashboard, relation, alert_handling, log_collection, log_extract, metadata]
                  description: Public tool domain used to select the corresponding IAM action. 公开工具领域，用于选择对应的 IAM 权限点；内部 operation MCP 不进入 Unified 权限查询。
                tool_name: {type: string, description: Exact underlying tool name. 底层工具精确名称。}
                resource_context:
                  type: object
                  additionalProperties: false
                  description: Optional target context for an exact native-first tool. 原生优先工具的目标资源上下文，提供时必须指定 tool_name。
                  properties:
                    index_set_id:
                      type: integer
                      minimum: 1
                      description: Index set ID discovered from the log catalog. 从日志目录取得的索引集 ID。
                    target_type:
                      type: string
                      enum: [index_set, scene]
                      description: Log target mode. Scene routes are authorized again by BK Log after resolving actual index sets. 日志目标模式；场景路由解析出实际索引集后由日志平台继续鉴权。
                    table_id:
                      type: string
                      description: Time-series result table ID discovered from the metric catalog. 从指标目录取得的时序结果表 ID。
                    table:
                      type: string
                      description: Event table ID discovered from the event catalog. 从事件目录取得的事件结果表 ID。
                    app_name:
                      type: string
                      description: APM application name discovered from the application catalog. 从 APM 应用目录取得的应用名称。
                    service_name:
                      type: string
                      description: APM service name required to select an APM-backed event branch. 用于选择 APM 事件分支的服务名称。
                    dashboard_uid:
                      type: string
                      description: Dashboard UID discovered from the dashboard tree. 从仪表盘目录取得的仪表盘 UID。
                    id:
                      type: string
                      description: Alert ID for detail or snapshot, strategy ID for current configuration. 详情或快照工具的告警 ID，或当前策略配置工具的策略 ID。
                    alert_id:
                      type: string
                      description: Alert ID for alert-related queries. 告警关联查询的告警 ID。
                include_apply_guide:
                  type: boolean
                  default: true
                  description: Return an IAM application URL when permission is missing. 缺少权限时是否返回 IAM 权限申请入口。
      x-bk-apigateway-resource:
        isPublic: false
        allowApplyPermission: false
        matchSubpath: false
        enableWebsocket: false
        backend: {name: default, method: post, path: /api/v4/unified_mcp/lookup_permissions/, matchSubpath: false, timeout: 30}
        pluginConfigs: []
        authConfig: {userVerifiedRequired: true, appVerifiedRequired: false, resourcePermissionRequired: true}
