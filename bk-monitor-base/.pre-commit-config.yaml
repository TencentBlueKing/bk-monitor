default_stages:
  - pre-commit

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.13
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
- repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
  rev: v1.13.0  # or whatever the latest version is at the time
  hooks:
  - id: basedpyright
    language: system
    args: [--level, warning]
    types_or: [python, pyi]
- repo: local
  hooks:
    - id: pytest
      name: pytest
      entry: pytest
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
      args: [--tb=short, --strict-markers, src/bk_monitor_base/tests/]
      stages: [pre-commit]
