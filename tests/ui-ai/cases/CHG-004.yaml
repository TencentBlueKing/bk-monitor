id: CHG-004
title: 日志检索原始日志与字段过滤壳层可见
priority: P0
engine: playwright
sources:
  - kind: quality-gate
    ref: change-smoke
    section: retrieve-overlay-p3
entry:
  path: "/retrieve"
preconditions:
  - type: environment
    name: AAFE_E2E_BASE_URL
    description: 本地 devServer 41001 可访问时执行上下文/字段过滤相关壳层检查
    required: false
steps:
  - action: navigate
    target: entry
  - action: wait
    target: load
  - action: wait
    target: ".search-bar, .retrieve-search-bar, .bklog-v2-result, .original-log, .filter-bar-main"
assertions:
  - id: assert-console
    check: console-no-errors
    expect: 无控制台错误
    policy: primary
  - id: assert-page
    check: visible
    target: ".search-bar, .retrieve-search-bar, .bklog-v2-result, .original-log, .filter-bar-main, .collect-list-box"
    expect: 原始日志/搜索栏壳层可见
    policy: primary
