id: CHG-002
title: 日志检索页搜索栏与收藏区可见
priority: P0
engine: playwright
sources:
  - kind: quality-gate
    ref: change-smoke
    section: retrieve-overlay
entry:
  path: "/retrieve"
preconditions:
  - type: environment
    name: AAFE_E2E_BASE_URL
    description: 本地 devServer 41001 可访问时执行检索浮层相关壳层检查
    required: false
steps:
  - action: navigate
    target: entry
  - action: wait
    target: load
  - action: wait
    target: ".search-bar, .retrieve-search-bar, .bklog-v3-grade-setting, .collect-list-box"
assertions:
  - id: assert-console
    check: console-no-errors
    expect: 无控制台错误
    policy: primary
  - id: assert-page
    check: visible
    target: ".search-bar, .retrieve-search-bar, .collect-list-box, .bklog-v2-echarts-container"
    expect: 检索页主壳层可见
    policy: primary
