id: CHG-003
title: 日志检索聚类区壳层可见
priority: P0
engine: playwright
sources:
  - kind: quality-gate
    ref: change-smoke
    section: retrieve-overlay-p3
entry:
  path: "/retrieve"
preconditions:
  - type: environment
    name: AAFE_E2E_BASE_URL
    description: 本地 devServer 41001 可访问时执行聚类浮层相关壳层检查
    required: false
steps:
  - action: navigate
    target: entry
  - action: wait
    target: load
  - action: wait
    target: ".retrieve-v3-content, .search-result, .bklog-v3-content, .result-tab, .clustering-nav"
assertions:
  - id: assert-console
    check: console-no-errors
    expect: 无控制台错误
    policy: primary
  - id: assert-page
    check: visible
    target: ".retrieve-v3-content, .search-result, .bklog-v3-content, .result-tab, .clustering-nav, .search-bar"
    expect: 检索结果/聚类相关壳层可见
    policy: primary
