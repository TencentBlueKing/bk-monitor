name: Relation rollout regression
on:
  pull_request:
    branches: [master]
    paths:
      - 'bkmonitor/api/unify_query/**'
      - 'bkmonitor/bkmonitor/utils/graph_relation.py'
      - 'bkmonitor/bkmonitor/utils/dynamic_settings.py'
      - 'bkmonitor/bkmonitor/define/global_config.py'
      - 'bkmonitor/config/default.py'
      - 'bkmonitor/core/prometheus/metrics.py'
      - 'bkmonitor/kernel_api/resource/**'
      - 'bkmonitor/kernel_api/tests/test_mcp_response_limits.py'
      - 'bkmonitor/metadata/resources/entity_relation.py'
      - 'bkmonitor/metadata/task/entity_relation.py'
      - 'bkmonitor/metadata/task/sync_cmdb_relation.py'
      - 'bkmonitor/metadata/tests/task/test_relation_*.py'
      - 'bkmonitor/metadata/tests/task/test_sync_cmdb_relation.py'
      - 'bkmonitor/tests/api/unify_query/test_relation_*.py'
      - 'docs/relation-query-rollout.md'
      - '.github/workflows/relation-rollout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: bkmonitor:bkmonitor/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Redis and isolated Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          python -m pip install pytest==8.3.5 Django==4.2.30 djangorestframework==3.15.2 fakeredis==2.28.1 redis==5.2.1 requests==2.32.3 arrow==1.3.0 prometheus-client==0.21.1 pycryptodome==3.22.0 python-dateutil==2.9.0.post0 six==1.17.0 pytz==2025.2 celery==5.4.0 opentelemetry-api==1.32.1
      - name: Routing, publication and storage isolation
        run: |
          command -v redis-server
          python -m pytest -p no:cacheprovider --noconftest -c /dev/null -q bkmonitor/tests/api/unify_query/test_relation_routing.py bkmonitor/metadata/tests/task/test_relation_schema_publication.py bkmonitor/metadata/tests/task/test_relation_query_isolation.py
      - name: MCP request and response contracts
        run: python -m pytest -p no:cacheprovider --noconftest -c /dev/null -q bkmonitor/kernel_api/tests/test_mcp_response_limits.py
