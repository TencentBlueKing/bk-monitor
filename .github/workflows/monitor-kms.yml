name: "[BKMonitor] KMS startup credentials"

on:
  pull_request:
    paths:
      - 'bkmonitor/**'
      - 'bk-monitor-base/**'
      - '.github/workflows/monitor-kms.yml'

permissions:
  contents: read

jobs:
  kms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bkmonitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Link shared packages as in the application image
        run: |
          ln -s ../ai_agent ai_agent
          ln -s ../iam_engine iam_engine
      - run: uv sync --frozen --group test
      - name: Prepare historical encryption SDK
        run: |
          legacy="$RUNNER_TEMP/monitor-crypto2"
          uv venv --python .venv/bin/python "$legacy"
          uv pip install --python "$legacy/bin/python" bk-crypto-python-sdk==2.0.1
          # Reuse the locked monitor dependencies, with the historical SDK taking precedence.
          current_site=$(.venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          legacy_site=$("$legacy/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          echo "$current_site" > "$legacy_site/monitor-dependencies.pth"
          echo "BKMONITOR_CRYPTO2_PYTHON=$legacy/bin/python" >> "$GITHUB_ENV"
      - name: Test startup settings and historical ciphertext
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: .venv/bin/python -m pytest -c /dev/null --noconftest -q tests/kms
