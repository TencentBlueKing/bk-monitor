name: AI Agent AG-UI contract

on:
  pull_request:
    paths:
      - "ai_agent/**"
      - "bkmonitor/Dockerfile"
      - "bkmonitor/pyproject.toml"
      - "bkmonitor/uv.lock"
      - "bkmonitor/scripts/*ai_agent_runtime*"
      - "bkmonitor/ai_whale/**"
      - "bkmonitor/config/default.py"
      - ".github/workflows/ai-agent-agui.yml"
  push:
    branches: [master]
    paths:
      - "ai_agent/**"
      - "bkmonitor/Dockerfile"
      - "bkmonitor/pyproject.toml"
      - "bkmonitor/uv.lock"
      - "bkmonitor/scripts/*ai_agent_runtime*"
      - "bkmonitor/ai_whale/**"
      - ".github/workflows/ai-agent-agui.yml"

permissions:
  contents: read

jobs:
  agui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public test dependencies
        run: python -m pip install pytest==8.3.4 Django==4.2.27 djangorestframework==3.15.1
      - name: Check AG-UI contracts and runtime build inputs
        run: >-
          python -m pytest -p no:cacheprovider -c /dev/null -q
          ai_agent/tests/test_agui.py bkmonitor/scripts/test_install_ai_agent_runtime.py
      - name: Check bk-audit and OpenTelemetry lock compatibility
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("bkmonitor/uv.lock").read_text(encoding="utf-8"))
          versions = {p["name"]: p["version"] for p in lock.get("package", [])}
          pkgs = [
              f"bk-audit[opentelemetry]=={versions['bk-audit']}",
              f"opentelemetry-api=={versions['opentelemetry-api']}",
              f"opentelemetry-sdk=={versions['opentelemetry-sdk']}",
              f"opentelemetry-exporter-otlp=={versions['opentelemetry-exporter-otlp']}",
          ]
          subprocess.run([sys.executable, "-m", "pip", "install", "--quiet", *pkgs], check=True)
          subprocess.run(
              [sys.executable, "-c", "import bk_audit.contrib.opentelemetry.setup as s; assert hasattr(s, 'setup')"],
              check=True,
          )
          PY
