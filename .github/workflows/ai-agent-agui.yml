name: AI Agent AG-UI contract

on:
  pull_request:
    paths:
      - "ai_agent/**"
      - "bkmonitor/ai_whale/**"
      - "bkmonitor/config/default.py"
      - ".github/workflows/ai-agent-agui.yml"
  push:
    branches: [master]
    paths:
      - "ai_agent/**"
      - "bkmonitor/ai_whale/**"
      - ".github/workflows/ai-agent-agui.yml"

permissions:
  contents: read

jobs:
  agui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public test dependencies
        run: python -m pip install pytest==8.3.4 Django==4.2.27 djangorestframework==3.15.1
      - name: Check AG-UI lifecycle and session contracts
        run: python -m pytest -p no:cacheprovider -c /dev/null -q ai_agent/tests/test_agui.py
